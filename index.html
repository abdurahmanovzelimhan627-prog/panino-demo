<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}img{max-width:100%}</style>
<title>PANINO Заказы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Простая учётная таблица: кафе строками; крупные слова вместо терминов. Классика = зелёный, Пепперони = красный (как на упаковке) */
:root{
  --bg:#F5F3EF; --card:#FFFFFF; --ink:#1F1B17; --muted:#6F665D; --line:#E6E0D7; --head:#FAF8F5;
  --red:#C8261F; --red-soft:#FBE7E5;
  --green:#4E9A2A; --green-ink:#2F6B17; --green-soft:#EAF4E2;
  --amber:#93590A; --amber-soft:#FCEFD9;
  --blue-soft:#E8F0FB; --blue-ink:#1F4E8C;
  --on-accent:#FFFFFF;
  --f-display:"Forum","Times New Roman",serif;
  --f-body:"Golos Text",-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171513;--card:#211E1B;--ink:#F1ECE6;--muted:#A99F94;--line:#36302A;--head:#1C1917;
  --red:#E5554C;--red-soft:#3A1F1C;--green:#7CC456;--green-ink:#9BD67B;--green-soft:#1E2E17;
  --amber:#F0B45A;--amber-soft:#3A2C15;--blue-soft:#1A2638;--blue-ink:#9CC0F0;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171513;--card:#211E1B;--ink:#F1ECE6;--muted:#A99F94;--line:#36302A;--head:#1C1917;
  --red:#E5554C;--red-soft:#3A1F1C;--green:#7CC456;--green-ink:#9BD67B;--green-soft:#1E2E17;
  --amber:#F0B45A;--amber-soft:#3A2C15;--blue-soft:#1A2638;--blue-ink:#9CC0F0;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:760px;margin:0 auto}
button,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-display);font-size:28px;letter-spacing:.14em;color:var(--red);line-height:1}
.date{font-size:13px;color:var(--muted);text-align:right}
.date b{display:block;color:var(--ink);font-size:14px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:12px}
.roles button{padding:8px 4px;border-radius:10px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}
.roles button svg{width:22px;height:22px}
.roles button small{font-weight:500;font-size:11px}
.roles button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* Строка «кто это видит» */
.who-sees{display:flex;gap:10px;align-items:flex-start;background:var(--blue-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:4px}
.who-sees b{color:var(--blue-ink)}
.who-sees svg{width:20px;height:20px;flex:none;color:var(--blue-ink);margin-top:1px}

h2{font-size:18px;font-weight:700;margin:22px 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px}

.tag{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.dot.cl{background:var(--green)} .dot.pe{background:var(--red)}
.th-img{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;border:2px solid var(--line)}
.th-img.cl{border-color:var(--green)} .th-img.pe{border-color:var(--red)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13px;color:var(--muted);margin-bottom:10px}
.legend .tag{color:var(--ink)} .legend .th-img{width:24px;height:24px}

/* Итоги дня */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sum div{padding:10px 12px}
.sum span{font-size:12px;color:var(--muted);display:block}
.sum b{font-size:20px}

/* Таблица */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--head);font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);line-height:1.2}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td:first-child{width:46%}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center} td.r,th.r{text-align:right}
td .addr{display:block;font-size:12px;color:var(--muted)}
td b{font-weight:600}
tr.done td{background:color-mix(in srgb,var(--green-soft) 45%,transparent)}
tfoot td{background:var(--head);font-weight:700;border-top:1px solid var(--line)}
.dash{color:var(--muted);opacity:.5}
.st{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;margin-top:4px}
.st.go{background:var(--amber-soft);color:var(--amber)}
.st.ok{background:var(--green-soft);color:var(--green-ink)}
.st.no{background:var(--head);color:var(--muted);border:1px solid var(--line);margin:0}
.ret{color:var(--red);font-weight:600}
.rsub{display:block;font-size:11px;font-weight:700;color:var(--red);line-height:1.1}
/* Поиск и фильтры владельца */
.tools{display:grid;gap:10px;margin-top:16px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;padding:12px 0;font:inherit;font-size:16px;color:var(--ink);outline:none}
.search:focus-within{border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.chips button span{color:var(--muted);font-weight:700;margin-left:2px}
.chips button.warn span{color:var(--red)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button[aria-pressed="true"] span{color:inherit;opacity:.75}
.why{display:block;font-size:11px;font-weight:600;color:var(--red);margin-top:2px}
.empty{padding:18px;text-align:center;margin-top:14px;color:var(--muted)}
.sell{font-size:12px;font-weight:600;line-height:1.25}
.sell.hi{color:var(--red)} .sell.lo{color:var(--green-ink)}
.lnk{color:var(--red);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}

/* Счётчик */
.cnt{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card);flex:none}
.cnt button{width:40px;height:40px;font-size:20px;font-weight:600}
.cnt output{min-width:30px;text-align:center;font-weight:700;font-size:16px}

/* Кафе */
.pick{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-top:12px}
.pick label{font-size:13px;color:var(--muted);flex:none}
.pick select{flex:1;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.prod{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.prod:last-child{border-bottom:0}
.prod img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none;background:var(--head)}
.prod .t{flex:1;min-width:0}
.prod .t span{display:block;font-size:12px;color:var(--muted)}
.btn{width:100%;padding:14px;border-radius:12px;font-weight:700;font-size:16px;background:var(--red);color:var(--on-accent);margin-top:12px}
.btn.gr{background:var(--green-ink)}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600;font-size:15px}
.btn[disabled]{background:var(--line);color:var(--muted);cursor:default}
.msg{padding:12px 14px;font-size:14px}
.msg.ok{background:var(--green-soft);border-color:transparent}
.msg.go{background:var(--amber-soft);border-color:transparent}
.msg.ask{border:2px solid var(--red)}
.lines{display:grid;gap:4px;margin:8px 0 0}
.lines div{display:flex;justify-content:space-between;gap:10px}
.lines .tot{font-weight:700;font-size:16px;border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}

/* Курьер */
.next{padding:14px;border:2px solid var(--ink)}
.next .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.next h3{margin:4px 0 0;font-size:20px}
.next .a{color:var(--muted);font-size:14px}
.give{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.give div{background:var(--head);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.give b{font-size:22px;margin-left:auto}
.back{margin-top:14px}
.back p{margin:0 0 6px;font-size:14px;font-weight:600}
.back .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.allr{padding:4px 14px}
.allr .li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.allr .li:last-child{border-bottom:0}
.allr .li span.a{display:block;font-size:12px;color:var(--muted)}
.allr .li .st{margin:0}
.finish{padding:18px;text-align:center}

/* Накладная */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(15,12,10,.5);display:flex;align-items:flex-end;justify-content:center;
  padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.inv{background:var(--card);width:100%;max-width:440px;border-radius:16px;padding:18px;max-height:90vh;overflow:auto}
.inv .hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px}
.inv .hd .logo{font-size:22px}
.inv .meta{font-size:13px;color:var(--muted);margin:10px 0 4px}
.inv .meta b{color:var(--ink)}
.inv td,.inv th{padding:8px 4px}
.inv td:first-child{width:auto}
.inv .pay{display:flex;justify-content:space-between;font-size:18px;font-weight:700;border-top:2px solid var(--ink);padding-top:8px;margin-top:6px}
.inv .ln{display:flex;justify-content:space-between;font-size:14px;margin-top:6px}
.inv .sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}
.inv .sg div{border:1px solid var(--line);border-radius:8px;padding:8px}
.inv .sg b{display:block;color:var(--green-ink);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.foot{font-size:12px;color:var(--muted);margin-top:18px;text-align:center}
@media (max-width:520px){.sum b{font-size:17px} th,td{padding:9px 4px} th:first-child,td:first-child{padding-left:10px} th:last-child,td:last-child{padding-right:10px}
  td:first-child{width:auto} .th-img{width:26px;height:26px} table{font-size:13px} .lnk{font-size:12px} td .st{font-size:11px;padding:2px 6px}}
</style>

<div class="app">
  <header>
    <div class="top">
      <div class="logo">PANINO</div>
      <div class="date">Заказы и доставка<b id="today"></b></div>
    </div>
    <div class="roles" role="tablist">
      <button role="tab" id="tab-owner" data-role="owner" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>Владелец<small>всё видно</small></button>
      <button role="tab" id="tab-cafe" data-role="cafe" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17M8 3v3M12 3v3"/></svg>Кафе<small>заказать</small></button>
      <button role="tab" id="tab-courier" data-role="courier" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 7h11v9H2zM13 10h4l4 3v3h-8"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>Курьер<small>развезти</small></button>
    </div>
  </header>
  <main id="view"></main>
  <p class="foot">Демо-версия. Кафе и адреса придуманы для примера.</p>
</div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
const PRICE=150;
const P=[
  {id:"cl",name:"Классика",comp:"Курица, шампиньоны, моцарелла",img:"img/classic.jpg"},
  {id:"pe",name:"Пепперони",comp:"Колбаса, моцарелла, соус",img:"img/pepperoni.jpg"}
];
// Придуманные кафе Махачкалы. del — что везём сегодня, ret — вернули, next — заказ на завтра, week — % возвратов за неделю
const C=(id,name,addr,cl,pe,st,time,rcl,rpe,week,next)=>({id,name,addr,del:{cl,pe},ret:{cl:rcl,pe:rpe},st,time,week,next});
const CAFES=[
  C(1,"Кофейня «Каспий»","ул. Дахадаева, 21",13,2,"go","",0,0,18,null),
  C(2,"Barhan Coffee","пр. Расула Гамзатова, 43",10,8,"ok","08:12",1,0,5,{cl:12,pe:8}),
  C(3,"Кафе «Утро»","пр. Имама Шамиля, 8",6,6,"go","",0,0,4,null),
  C(4,"Кофейня «Чашка»","ул. Ярагского, 64",8,4,"ok","08:31",2,1,21,{cl:6,pe:3}),
  C(5,"Кафе «Сарахан»","ул. Коркмасова, 12",12,6,"ok","08:47",0,0,3,{cl:12,pe:8}),
  C(6,"Горец Coffee","пр. Петра I, 59",9,5,"go","",0,0,7,{cl:10,pe:5}),
  C(7,"Кофейня «Маяк»","ул. Буйнакского, 5",7,7,"ok","09:05",2,0,12,null),
  C(8,"Кафе «Зерно»","ул. М. Гаджиева, 176",10,4,"go","",0,0,6,{cl:10,pe:6}),
  C(9,"Кафе «Нур»","пр. Акушинского, 30",6,3,"ok","09:20",0,0,2,{cl:8,pe:4}),
  C(10,"Кофейня «Бриз»","ул. Пушкина, 14",8,8,"go","",0,0,15,null)
];
CAFES.forEach((c,i)=>c.no=1411+i);
const S={role:"owner",cafe:1,cart:{cl:0,pe:0},f:"all",qs:""};

const $=s=>document.querySelector(s);
const rub=n=>n.toLocaleString("ru-RU")+" ₽";
const q=o=>o.cl+o.pe;
const sum=o=>q(o)*PRICE;
const pay=c=>sum(c.del)-sum(c.ret);
const byId=id=>CAFES.find(c=>c.id===+id);
const now=()=>new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
const tag=p=>`<span class="tag"><i class="dot ${p.id}"></i>${p.name}</span>`;
const thumbs=()=>P.map(p=>`<th class="c"><img class="th-img ${p.id}" src="${p.img}" alt="${p.name}" title="${p.name}"></th>`).join("");
const legend=()=>`<div class="legend">${P.map(p=>`<span class="tag"><img class="th-img ${p.id}" src="${p.img}" alt="">${p.name}</span>`).join("")}<span>по ${PRICE} ₽ за штуку</span></div>`;
const EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const sees=t=>`<div class="who-sees">${EYE}<div>${t}</div></div>`;
function status(c){return c.st==="ok"?`<span class="st ok">✓ Привезли в ${c.time}</span>`:c.st==="wait"?`<span class="st go">Ждём, пока кафе подтвердит</span>`:`<span class="st go">Курьер едет</span>`}
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2400)}
function cnt(key,val){return `<span class="cnt"><button aria-label="Меньше" data-act="n" data-k="${key}" data-d="-1">−</button><output class="num">${val}</output><button aria-label="Больше" data-act="n" data-k="${key}" data-d="1">+</button></span>`}

/* ========== ВЛАДЕЛЕЦ ========== */
function vOwner(){
  const done=CAFES.filter(c=>c.st==="ok"),tot={cl:0,pe:0},rt={cl:0,pe:0};
  CAFES.forEach(c=>{tot.cl+=c.del.cl;tot.pe+=c.del.pe;if(c.st==="ok"){rt.cl+=c.ret.cl;rt.pe+=c.ret.pe}});
  const money=done.reduce((a,c)=>a+pay(c),0);
  let h=sees(`Это экран <b>владельца</b>. Все кафе в одной таблице — кто что получил, сколько вернул и сколько заплатит. Всё обновляется само.`)+
  `<div class="sum">
    <div class="box"><span>Привезли</span><b class="num">${done.length} из ${CAFES.length}</b></div>
    <div class="box"><span>Вернули</span><b class="num ret">${q(rt)} шт</b><span class="num">Кл ${rt.cl} · Пеп ${rt.pe}</span></div>
    <div class="box"><span>Заплатят</span><b class="num">${rub(money)}</b></div></div>

  <div class="tools">
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="own-q" type="search" placeholder="Найти кафе или улицу" value="${S.qs.replace(/"/g,"&quot;")}" autocomplete="off"></label>
    <div class="chips" id="chips">${chips()}</div>
  </div>
  <div id="ot">${ownerTables()}</div>`;
  return h;
}

// Фильтры владельца: с 65 кафе сначала смотрят на проблемные
const FLT=[
  ["all","Все",()=>true],
  ["prob","Проблемы",c=>probScore(c)>0],
  ["way","Ещё не привезли",c=>c.st!=="ok"],
  ["nonext","Не заказали",c=>!c.next],
  ["ret","Много возвратов",c=>c.week>=10]
];
const probScore=c=>(c.next?0:1)+(c.week>=10?1:0)+(c.st!=="ok"?1:0);
function listed(){
  const f=FLT.find(x=>x[0]===S.f)[2], s=S.qs.trim().toLowerCase();
  let L=CAFES.filter(c=>f(c)&&(!s||(c.name+" "+c.addr).toLowerCase().includes(s)));
  if(S.f==="prob") L=[...L].sort((a,b)=>probScore(b)-probScore(a));
  return L;
}
function chips(){return FLT.map(([id,l,f])=>`<button data-act="flt" data-id="${id}" aria-pressed="${S.f===id}" class="${id!=="all"?"warn":""}">${l} <span class="num">${CAFES.filter(f).length}</span></button>`).join("")}
function probWhy(c){return [!c.next&&"не заказали",c.week>=10&&"много возвратов",c.st!=="ok"&&"ещё не привезли"].filter(Boolean).join(" · ")}

function ownerTables(){
  const L=listed();
  if(!L.length) return `<div class="box empty">Ничего не нашлось. <button class="lnk" data-act="reset">Показать все кафе</button></div>`;
  const tot={cl:0,pe:0},rt={cl:0,pe:0};let money=0;
  L.forEach(c=>{tot.cl+=c.del.cl;tot.pe+=c.del.pe;if(c.st==="ok"){rt.cl+=c.ret.cl;rt.pe+=c.ret.pe;money+=pay(c)}});
  const shown=L.length<CAFES.length?`<p class="sub">Показано ${L.length} из ${CAFES.length} · <button class="lnk" data-act="reset">показать все</button></p>`:"";
  let h=`${shown}<h2>Сегодня развозим</h2>${legend()}
  <div class="tw"><table class="num"><thead><tr>
    <th>Кафе</th>${thumbs()}<th class="c">Назад</th><th class="r">Сумма</th>
  </tr></thead><tbody>`;
  L.forEach(c=>{const r=q(c.ret),ok=c.st==="ok";
    h+=`<tr class="${ok?"done":""}"><td><b>${c.name}</b><span class="addr">${c.addr}</span>${status(c)}</td>
    ${P.map(p=>`<td class="c">${c.del[p.id]}${ok&&c.ret[p.id]?`<span class="rsub">−${c.ret[p.id]}</span>`:""}</td>`).join("")}
    <td class="c">${ok?(r?`<span class="ret">${r}</span>`:"0"):`<span class="dash">—</span>`}</td>
    <td class="r">${ok?`<button class="lnk" data-act="inv" data-id="${c.id}">${rub(pay(c))}</button>`:`<span class="dash">—</span>`}</td></tr>`});
  h+=`</tbody><tfoot><tr><td>Всего</td><td class="c">${tot.cl}</td><td class="c">${tot.pe}</td><td class="c ret">${q(rt)}</td><td class="r">${rub(money)}</td></tr></tfoot></table></div>
  <p class="sub" style="margin-top:6px">Красная цифра под количеством — сколько этой закуски вернули. Нажмите на сумму — откроется накладная.</p>`;

  const nx=L.filter(c=>c.next),nt={cl:0,pe:0};nx.forEach(c=>{nt.cl+=c.next.cl;nt.pe+=c.next.pe});
  h+=`<h2>Заказали на завтра</h2><p class="sub">Заказы принимаются до 20:00 · заказали ${CAFES.filter(c=>c.next).length} из ${CAFES.length}</p>
  <div class="tw"><table class="num"><thead><tr>
    <th>Кафе</th>${thumbs()}<th class="c">Как продают</th>
  </tr></thead><tbody>`;
  L.forEach(c=>{const hi=c.week>=10;
    h+=`<tr><td><b>${c.name}</b><span class="addr">${c.addr}</span>${S.f==="prob"?`<span class="why">${probWhy(c)}</span>`:""}</td>
    ${c.next?`<td class="c">${c.next.cl}</td><td class="c">${c.next.pe}</td>`:`<td class="c" colspan="2"><span class="st no">Ещё не заказали</span></td>`}
    <td class="c"><span class="sell ${hi?"hi":"lo"}">${hi?`Везти<br>меньше`:"Хорошо"}</span><span class="addr">${c.week}% назад</span></td></tr>`});
  h+=`</tbody><tfoot><tr><td>Нужно испечь</td><td class="c">${nt.cl}</td><td class="c">${nt.pe}</td><td></td></tr></tfoot></table></div>`;
  return h;
}

/* ========== КАФЕ ========== */
function vCafe(){
  const c=byId(S.cafe);
  let h=sees(`Это экран <b>кафе</b>. Здесь кафе заказывает закуски на завтра и подтверждает, что курьер всё привёз.`)+
  `<div class="box pick"><label for="cafe-pick">Вы —</label><select id="cafe-pick" data-act="pick">${CAFES.map(x=>`<option value="${x.id}" ${x.id===c.id?"selected":""}>${x.name}</option>`).join("")}</select></div>
  <p class="sub" style="margin-top:6px">В настоящем боте выбирать не нужно: кафе узнаётся само, адрес подставляется сам.</p>

  <h2>Сегодня</h2>`;
  if(c.st==="wait"){
    h+=`<div class="box msg ask"><b>Курьер привёз заказ. Всё верно?</b>
      <div class="lines num">${P.map(p=>`<div>${tag(p)}<span>${c.del[p.id]} шт</span></div>`).join("")}
      ${P.filter(p=>c.ret[p.id]).map(p=>`<div class="ret"><span>Возврат: ${p.name}</span><span>${c.ret[p.id]} шт · −${rub(c.ret[p.id]*PRICE)}</span></div>`).join("")}
      <div class="tot"><span>К оплате</span><span>${rub(pay(c))}</span></div></div>
      <button class="btn gr" data-act="confirm">Да, всё верно</button></div>`;
  } else if(c.st==="ok"){
    h+=`<div class="box msg ok">✓ Заказ получен в ${c.time}. <button class="lnk" data-act="inv" data-id="${c.id}">Накладная · ${rub(pay(c))}</button></div>`;
  } else {
    h+=`<div class="box msg go">Курьер едет к вам: ${P.map(p=>`${p.name} ${c.del[p.id]} шт`).join(", ")}</div>`;
  }

  // История поставок кафе с возвратами
  const hist=history(c),ht={del:0,ret:0,pay:0};
  hist.forEach(r=>{ht.del+=r.del;ht.ret+=r.ret;ht.pay+=r.pay});
  h+=`<h2>Мои поставки за неделю</h2><p class="sub">Сколько привезли, сколько вернули и сколько заплатили</p>
  <div class="tw"><table class="num"><thead><tr><th>День</th><th class="c">Привезли</th><th class="c">Вернули</th><th class="r">Заплатили</th></tr></thead><tbody>
  ${hist.map(r=>`<tr><td><b>${r.day}</b>${r.ret?`<span class="addr">${r.what}</span>`:""}</td><td class="c">${r.del}</td><td class="c">${r.ret?`<span class="ret">${r.ret}</span>`:"0"}</td><td class="r">${rub(r.pay)}</td></tr>`).join("")}
  </tbody><tfoot><tr><td>За неделю</td><td class="c">${ht.del}</td><td class="c ret">${ht.ret}</td><td class="r">${rub(ht.pay)}</td></tr></tfoot></table></div>`;

  h+=`<h2>Заказ на завтра</h2><p class="sub">До 20:00 · ${PRICE} ₽ за штуку</p>`;
  if(c.next){
    h+=`<div class="box msg ok">✓ Заказ отправлен: Классика ${c.next.cl}, Пепперони ${c.next.pe} · ${rub(sum(c.next))}</div>
    <button class="btn line" data-act="edit">Изменить заказ</button>`;
  } else {
    h+=`<div class="box">${P.map(p=>`<div class="prod"><img src="${p.img}" alt="${p.name}"><div class="t">${tag(p)}<span>${p.comp}</span></div>${cnt(p.id,S.cart[p.id])}</div>`).join("")}</div>
    <button class="btn" data-act="order" ${q(S.cart)?"":"disabled"}>${q(S.cart)?`Отправить заказ · ${q(S.cart)} шт · ${rub(sum(S.cart))}`:"Нажмите «+», чтобы выбрать"}</button>`;
  }
  return h;
}

// Примерная история за 5 прошлых дней (+ сегодня, если уже привезли). Возвраты — по проценту кафе
function history(c){
  const rows=[],fmt=d=>d.toLocaleDateString("ru-RU",{day:"numeric",month:"short",weekday:"short"});
  if(c.st==="ok"){rows.push({day:"Сегодня",del:q(c.del),ret:q(c.ret),pay:pay(c),what:retWhat(c.ret)})}
  for(let i=1;i<=5;i++){
    const d=new Date();d.setDate(d.getDate()-i);
    const dl={cl:Math.max(1,c.del.cl+((c.id*3+i)%3)-1),pe:Math.max(1,c.del.pe+((c.id+i)%3)-1)};
    const n=Math.round(q(dl)*c.week/100*(0.6+((c.id+i*7)%5)/5));
    const r={cl:Math.min(dl.cl,Math.ceil(n*.6)),pe:0};r.pe=Math.min(dl.pe,n-r.cl);
    rows.push({day:fmt(d),del:q(dl),ret:q(r),pay:sum(dl)-sum(r),what:retWhat(r)});
  }
  return rows;
}
const retWhat=r=>P.filter(p=>r[p.id]).map(p=>`${p.name} ${r[p.id]}`).join(", ");

/* ========== КУРЬЕР ========== */
function vCourier(){
  const nxt=CAFES.find(c=>c.st==="go"), left=CAFES.filter(c=>c.st==="go").length;
  let h=sees(`Это экран <b>курьера</b>. Он видит, куда ехать и что отдать. На месте отмечает, сколько забрал назад, и жмёт «Доставил».`);
  if(nxt){
    h+=`<h2>Следующая точка</h2><p class="sub">Осталось ${left} из ${CAFES.length}</p>
    <div class="box next"><div class="lbl">Едем сюда</div><h3>${nxt.name}</h3><div class="a">${nxt.addr}</div>
      <div class="give num">${P.map(p=>`<div>${tag(p)}<b>${nxt.del[p.id]}</b></div>`).join("")}</div>
      <div class="back"><p>Сколько непроданных забрал назад?</p>
        ${P.map(p=>`<div class="row">${tag(p)}${cnt(nxt.id+":"+p.id,nxt.ret[p.id])}</div>`).join("")}</div>
      <button class="btn" data-act="done" data-id="${nxt.id}">Доставил · к оплате ${rub(pay(nxt))}</button></div>`;
  } else {
    h+=`<div class="box finish" style="margin-top:16px"><b>✓ Маршрут закончен</b><p class="sub" style="margin:4px 0 0">Все кафе получили заказ.</p></div>`;
  }
  const back={cl:0,pe:0};CAFES.filter(c=>c.st!=="go").forEach(c=>{back.cl+=c.ret.cl;back.pe+=c.ret.pe});
  h+=`<h2>Возврат в машине</h2><p class="sub">Это нужно сдать в цех в конце дня</p>
  <div class="give num">${P.map(p=>`<div class="box">${tag(p)}<b class="ret">${back[p.id]}</b></div>`).join("")}</div>
  <h2>Весь маршрут</h2><div class="box allr">`;
  CAFES.forEach((c,i)=>{
    h+=`<div class="li"><div><b>${i+1}. ${c.name}</b><span class="a">${c.addr}${c.st!=="go"&&q(c.ret)?` · <span class="ret">возврат ${retWhat(c.ret)}</span>`:""}</span></div>${c.st==="ok"?`<span class="st ok">✓ ${c.time}</span>`:c.st==="wait"?`<span class="st go">Ждём кафе</span>`:c===nxt?`<span class="st go">Едем сейчас</span>`:`<span class="st no">Впереди</span>`}</div>`;
  });
  return h+`</div>`;
}

/* ========== НАКЛАДНАЯ ========== */
function invoice(id){
  const c=byId(id);
  $("#sheet").innerHTML=`<div class="inv" role="dialog" aria-label="Накладная">
    <div class="hd"><span class="logo">PANINO</span><span class="num" style="font-size:13px">Накладная №${c.no}</span></div>
    <div class="meta">${new Date().toLocaleDateString("ru-RU")} · <b>${c.name}</b>, ${c.addr}</div>
    <table class="num"><thead><tr><th>Наименование</th><th class="c">Кол-во</th><th class="c">Цена</th><th class="r">Сумма</th></tr></thead><tbody>
    ${P.map(p=>`<tr><td>${p.name}</td><td class="c">${c.del[p.id]}</td><td class="c">${PRICE}</td><td class="r">${(c.del[p.id]*PRICE).toLocaleString("ru-RU")}</td></tr>`).join("")}</tbody></table>
    <div class="ln num"><span>Итого</span><span>${rub(sum(c.del))}</span></div>
    ${q(c.ret)?`<div class="ln num ret"><span>Возврат ${q(c.ret)} шт</span><span>−${rub(sum(c.ret))}</span></div>`:""}
    <div class="pay num"><span>К оплате</span><span>${rub(pay(c))}</span></div>
    <div class="sg"><div>Сдал<b>✓ Курьер Магомед</b>${c.time}</div><div>Принял<b>✓ ${c.name}</b>в боте</div></div>
    <p class="sub" style="margin-top:10px">Накладная сама пришла кафе и владельцу. Писать от руки не нужно.</p>
    <button class="btn line" data-act="close">Закрыть</button></div>`;
  $("#sheet").hidden=false;
}

function render(){
  document.querySelectorAll(".roles button").forEach(b=>b.setAttribute("aria-selected",b.dataset.role===S.role));
  $("#view").innerHTML=S.role==="owner"?vOwner():S.role==="cafe"?vCafe():vCourier();
}
// Поиск перерисовывает только таблицы, чтобы поле ввода не теряло фокус
document.addEventListener("input",e=>{if(e.target.id==="own-q"){S.qs=e.target.value;$("#ot").innerHTML=ownerTables()}});
document.addEventListener("change",e=>{if(e.target.id==="cafe-pick"){S.cafe=+e.target.value;S.cart={cl:0,pe:0};render()}});
document.addEventListener("click",e=>{
  if(e.target.id==="sheet"){$("#sheet").hidden=true;return}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.role){S.role=b.dataset.role;render();scrollTo(0,0);return}
  const a=b.dataset.act,d=+b.dataset.d;
  if(a==="n"){const k=b.dataset.k;
    if(k.includes(":")){const[id,p]=k.split(":"),c=byId(id);c.ret[p]=Math.min(c.del[p],Math.max(0,c.ret[p]+d))}
    else S.cart[k]=Math.max(0,S.cart[k]+d)}
  if(a==="order"){byId(S.cafe).next={...S.cart};S.cart={cl:0,pe:0};toast("Заказ отправлен — владелец уже видит его")}
  if(a==="edit"){const c=byId(S.cafe);S.cart={...c.next};c.next=null}
  if(a==="done"){const c=byId(b.dataset.id);c.st="wait";c.time=now();S.cafe=c.id;toast("Кафе получило сообщение «Всё верно?»")}
  if(a==="confirm"){const c=byId(S.cafe);c.st="ok";render();invoice(c.id);return}
  if(a==="flt"){S.f=b.dataset.id}
  if(a==="reset"){S.f="all";S.qs=""}
  if(a==="inv"){invoice(b.dataset.id);return}
  if(a==="close"){$("#sheet").hidden=true;return}
  render();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#sheet").hidden=true});
$("#today").textContent=new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"long"});
render();
</script>
